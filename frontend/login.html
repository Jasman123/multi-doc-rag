<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — DocMind</title>
<script src="assets/theme-init.js"></script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<noscript>DocMind needs JavaScript enabled.</noscript>

<script src="assets/app.js"></script>
<script>
(() => {
  const { el, icon, escapeHtml, errorText, json, API_BASE } = DocMind;

  // Already signed in? Go straight to the app (index.html clears bad tokens and returns here).
  if (DocMind.getAccessToken()) { window.location.href = 'index.html'; return; }

  let mode = 'login'; // 'login' | 'register'

  const tabLogin = el('button', { class: 'tab', type: 'button', role: 'tab', id: 'tabLogin', 'aria-selected': 'true', 'aria-controls': 'authPanel', text: 'Sign in' });
  const tabRegister = el('button', { class: 'tab', type: 'button', role: 'tab', id: 'tabRegister', 'aria-selected': 'false', 'aria-controls': 'authPanel', tabindex: '-1', text: 'Create account' });

  const error = el('div', { class: 'alert', role: 'alert', hidden: true });
  const email = el('input', { class: 'input', id: 'email', type: 'email', autocomplete: 'username', required: true });
  const password = el('input', { class: 'input', id: 'password', type: 'password', autocomplete: 'current-password', required: true, minlength: '8' });
  const hint = el('span', { class: 'hint', id: 'pwHint', text: 'At least 8 characters.', hidden: true });
  const submit = el('button', { class: 'btn btn-primary btn-block', type: 'submit', style: 'margin-top:.5rem', text: 'Sign in' });
  password.setAttribute('aria-describedby', 'pwHint');

  const form = el('form', { id: 'authPanel', role: 'tabpanel', 'aria-labelledby': 'tabLogin', novalidate: true },
    error,
    el('div', { class: 'field' }, el('label', { for: 'email', text: 'Email' }), email),
    el('div', { class: 'field' }, el('label', { for: 'password', text: 'Password' }), password, hint),
    submit);

  function showError(msg) {
    error.innerHTML = `${icon('alert')}<span>${escapeHtml(msg)}</span>`;
    error.hidden = false;
  }

  function setMode(next) {
    mode = next;
    const login = next === 'login';
    tabLogin.setAttribute('aria-selected', String(login));
    tabRegister.setAttribute('aria-selected', String(!login));
    tabLogin.tabIndex = login ? 0 : -1;
    tabRegister.tabIndex = login ? -1 : 0;
    form.setAttribute('aria-labelledby', login ? 'tabLogin' : 'tabRegister');
    submit.textContent = login ? 'Sign in' : 'Create account';
    password.autocomplete = login ? 'current-password' : 'new-password';
    hint.hidden = login;
    error.hidden = true;
  }
  tabLogin.addEventListener('click', () => setMode('login'));
  tabRegister.addEventListener('click', () => setMode('register'));
  [tabLogin, tabRegister].forEach((t) => t.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const next = mode === 'login' ? tabRegister : tabLogin;
      next.click(); next.focus();
    }
  }));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.hidden = true;
    const mail = email.value.trim();
    if (!mail || !email.checkValidity()) { showError('Enter a valid email address.'); email.focus(); return; }
    if (mode === 'register' && password.value.length < 8) { showError('Password must be at least 8 characters.'); password.focus(); return; }
    if (!password.value) { showError('Enter your password.'); password.focus(); return; }

    submit.disabled = true;
    submit.textContent = mode === 'login' ? 'Signing in…' : 'Creating account…';
    try {
      if (mode === 'register') {
        const reg = await fetch(`${API_BASE}/auth/register`, { ...json('POST', { email: mail, password: password.value }) });
        const regData = await reg.json().catch(() => null);
        if (!reg.ok) throw new Error(errorText(regData, 'Registration failed.'));
      }
      const res = await fetch(`${API_BASE}/auth/login`, { ...json('POST', { email: mail, password: password.value }) });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(errorText(data, 'Sign-in failed.'));
      DocMind.setTokens(data.access_token, data.refresh_token);
      window.location.href = 'index.html';
    } catch (err) {
      showError(err instanceof TypeError ? 'Can’t reach the server. Try again in a moment.' : err.message);
      submit.disabled = false;
      submit.textContent = mode === 'login' ? 'Sign in' : 'Create account';
    }
  });

  document.body.replaceChildren(
    el('main', { class: 'auth' },
      el('div', { class: 'card auth-card' },
        el('div', { class: 'brand', html: `${icon('mark')}<span>DocMind</span>` }),
        el('h1', { text: 'Welcome back' }),
        el('p', { class: 'lead', text: 'Sign in to ask questions across your organization’s documents.' }),
        el('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Account' }, tabLogin, tabRegister),
        form)));
  email.focus();
})();
</script>
</body>
</html>
