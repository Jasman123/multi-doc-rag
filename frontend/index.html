<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — DocMind</title>
<script src="assets/theme-init.js"></script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<noscript>DocMind needs JavaScript enabled.</noscript>

<script src="assets/app.js"></script>
<script>
(async () => {
  const { el, api, json, icon, renderMarkdown, errorText, toast } = DocMind;

  const user = await DocMind.requireUser();
  if (!user) return;
  const shell = DocMind.mountShell({ active: 'chat', title: 'Chat', user });
  const isAdmin = user.role === 'admin';

  const MIN_LEN = 3;
  const MAX_LEN = 1000;
  const SUGGESTIONS = [
    'Summarize the key findings',
    'What are the main risks?',
    'List the key obligations',
    'What does this say about pricing?',
  ];

  let documents = [];          // [{ document_id, filename, chunk_count }]
  let selected = new Set();    // document_ids; empty = all documents
  let online = true;
  let busy = false;

  // ─── Layout ───────────────────────────────────────────────────────────────
  const thread = el('div', { class: 'chat-col', id: 'thread', role: 'log', 'aria-live': 'polite', 'aria-relevant': 'additions' });
  const scroll = el('div', { class: 'chat-scroll' }, thread);

  const input = el('textarea', { id: 'question', rows: '1', placeholder: 'Ask a question about your documents' });
  const sendBtn = el('button', { class: 'btn btn-primary', type: 'submit', 'aria-label': 'Send question', html: icon('send') });
  const counter = el('span', { class: 'counter', text: `0 / ${MAX_LEN}` });
  const composer = el('form', { class: 'composer' },
    el('label', { class: 'sr-only', for: 'question', text: 'Your question' }), input, sendBtn);
  const composerWrap = el('div', { class: 'composer-wrap' },
    el('div', { class: 'chat-col' }, composer,
      el('div', { class: 'composer-foot' },
        el('span', { class: 'keys', text: 'Enter to send · Shift+Enter for a new line · Each question is answered on its own' }),
        counter)));

  shell.main.append(el('div', { class: 'chat' }, scroll, composerWrap));

  // ─── Scope picker (top bar) ───────────────────────────────────────────────
  const scopeBtn = el('button', { class: 'btn btn-secondary btn-sm scope-btn', type: 'button', id: 'scopeBtn' });
  const scopePanel = el('div', { class: 'popover', hidden: true });
  const scope = el('div', { class: 'scope' }, scopeBtn, scopePanel);
  shell.topbarSlot.replaceChildren(scope);
  DocMind.bindPopover(scopeBtn, scopePanel);

  function renderScope() {
    const total = documents.length;
    const label = selected.size === 0 ? `All documents (${total})` : `${selected.size} of ${total} documents`;
    scopeBtn.innerHTML = `<span>Searching: ${DocMind.escapeHtml(label)}</span>${icon('chevron')}`;
    scopeBtn.disabled = total === 0;

    scopePanel.replaceChildren();
    const row = (checked, text, onChange) => {
      const cb = el('input', { type: 'checkbox' });
      cb.checked = checked;
      cb.addEventListener('change', onChange);
      return el('label', { class: 'scope-row' }, cb, el('span', { text, title: text }));
    };
    scopePanel.append(row(selected.size === 0, 'All documents', () => { selected.clear(); renderScope(); }));
    scopePanel.append(el('hr', { class: 'scope-sep' }));
    documents.forEach((d) => {
      scopePanel.append(row(selected.has(d.document_id), d.filename, () => {
        selected.has(d.document_id) ? selected.delete(d.document_id) : selected.add(d.document_id);
        renderScope();
      }));
    });
  }

  // ─── Empty state ──────────────────────────────────────────────────────────
  function renderEmpty() {
    thread.replaceChildren();
    const box = el('section', { class: 'empty-chat', id: 'emptyChat' });
    if (documents.length === 0) {
      box.append(
        el('div', { class: 'empty-state' },
          el('span', { html: icon('file') }),
          el('strong', { text: 'No documents yet' }),
          el('span', { text: isAdmin ? 'Upload PDFs to start asking questions.' : 'Ask an administrator to add documents.' }),
          isAdmin ? el('a', { class: 'btn btn-primary', href: 'documents.html', html: `${icon('upload')}<span>Upload documents</span>` }) : null,
        ));
    } else {
      box.append(
        el('h1', { text: 'Ask your documents' }),
        el('p', { text: 'Answers are drawn from the documents your organization has added.' }),
        el('p', { class: 'meta', text: `Searching ${documents.length} document${documents.length === 1 ? '' : 's'}.` }),
        el('div', { class: 'prompts' }, ...SUGGESTIONS.map((s, i) =>
          el('button', {
            class: 'prompt', type: 'button', text: s, style: `animation-delay:${i * 80}ms`,
            onclick: () => { input.value = s; onInput(); input.focus(); },
          }))),
      );
    }
    thread.append(box);
  }

  // ─── Composer state ───────────────────────────────────────────────────────
  function updateComposer() {
    const len = input.value.trim().length;
    const raw = input.value.length;
    counter.textContent = `${raw} / ${MAX_LEN}`;
    counter.classList.toggle('over', raw > MAX_LEN);
    const blocked = !online || documents.length === 0;
    input.disabled = blocked;
    input.placeholder = !online ? 'Server unavailable' : documents.length === 0 ? 'No documents to search yet' : 'Ask a question about your documents';
    sendBtn.disabled = blocked || busy || len < MIN_LEN || raw > MAX_LEN;
  }
  function onInput() {
    input.style.height = 'auto';
    input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
    updateComposer();
  }
  input.addEventListener('input', onInput);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!sendBtn.disabled) composer.requestSubmit(); }
  });
  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (sendBtn.disabled || !q) return;
    input.value = '';
    onInput();
    ask(q);
  });

  // ─── Messages ─────────────────────────────────────────────────────────────
  const nearBottom = () => scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 140;
  const toBottom = () => scroll.scrollTo({ top: scroll.scrollHeight });

  function userMessage(text) {
    return el('div', { class: 'message user' },
      el('div', { class: 'who label-caps', text: 'You' }),
      el('div', { class: 'bubble', text }));
  }

  function sourcesBlock(sources) {
    if (!sources || sources.length === 0) return null; // hidden by admin setting → render nothing
    return el('details', { class: 'sources' },
      el('summary', { html: `<span>Sources (${sources.length})</span>${icon('chevron')}` }),
      ...sources.map((s) => {
        const long = s.snippet.length > 240;
        const snippet = el('div', { class: `source-snippet${long ? ' clamp' : ''}`, text: s.snippet });
        const card = el('div', { class: 'source' },
          el('div', { class: 'source-meta' },
            el('span', { class: 'source-file', text: s.filename }),
            el('span', { class: 'source-page', text: `p.${s.page}` }),
            el('span', {
              class: 'source-score', text: `match ${s.relevance_score.toFixed(2)}`,
              title: 'Semantic similarity to your question (0–1). Sources are ordered by combined vector and keyword rank, not strictly by this number.',
            })),
          snippet);
        if (long) {
          const more = el('button', { class: 'btn btn-ghost btn-sm', type: 'button', text: 'Show more' });
          more.addEventListener('click', () => {
            const clamped = snippet.classList.toggle('clamp');
            more.textContent = clamped ? 'Show more' : 'Show less';
          });
          card.append(more);
        }
        return card;
      }));
  }

  function answerMessage(data) {
    const copyBtn = el('button', { class: 'btn btn-ghost btn-sm', type: 'button', html: `${icon('copy')}<span>Copy</span>` });
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(data.answer);
        copyBtn.innerHTML = `${icon('check')}<span>Copied</span>`;
        setTimeout(() => { copyBtn.innerHTML = `${icon('copy')}<span>Copy</span>`; }, 2000);
      } catch { toast('Couldn’t copy to the clipboard.', 'error'); }
    });
    return el('div', { class: 'message assistant' },
      el('div', { class: 'who label-caps', text: 'DocMind' }),
      el('div', { class: 'answer', html: renderMarkdown(data.answer) }),
      el('div', { class: 'msg-actions' }, copyBtn,
        data.model_used ? el('span', { class: 'mono muted', text: data.model_used }) : null),
      sourcesBlock(data.sources));
  }

  function errorMessage(text, retry) {
    const answer = el('div', { class: 'answer error', html: icon('alert') });
    answer.append(document.createTextNode(` ${text}`));
    const node = el('div', { class: 'message assistant' },
      el('div', { class: 'who label-caps', text: 'DocMind' }), answer);
    if (retry) {
      const btn = el('button', { class: 'btn btn-secondary btn-sm', type: 'button', html: `${icon('retry')}<span>Retry</span>` });
      btn.addEventListener('click', () => { node.remove(); retry(); });
      node.append(el('div', { class: 'msg-actions' }, btn));
    }
    return node;
  }

  function typingMessage() {
    return el('div', { class: 'message assistant', 'aria-label': 'DocMind is answering' },
      el('div', { class: 'who label-caps', text: 'DocMind' }),
      el('div', { class: 'typing', html: '<span></span><span></span><span></span>' }));
  }

  // ─── Ask ──────────────────────────────────────────────────────────────────
  async function ask(question, { echo = true } = {}) {
    document.getElementById('emptyChat')?.remove();
    if (echo) { thread.append(userMessage(question)); toBottom(); }
    busy = true; updateComposer();
    const typing = typingMessage();
    thread.append(typing); toBottom();

    const retry = () => ask(question, { echo: false });
    let node;
    try {
      const res = await api('/query/', json('POST', { question, document_ids: [...selected], top_k: 8 }));
      const data = await res.json().catch(() => null);
      if (res.ok) {
        node = answerMessage(data);
      } else if (res.status === 400) {
        node = errorMessage('No documents have been added yet. Ask an administrator to upload some.');
      } else if (res.status === 422) {
        node = errorMessage(errorText(data, 'That question couldn’t be processed.'));
      } else {
        node = errorMessage('Something went wrong while answering. Please try again.', retry);
      }
    } catch (err) {
      if (err instanceof TypeError) { setOnline(false); node = errorMessage('Can’t reach the server.', retry); }
      else node = errorMessage(err.message);
    }
    const stick = nearBottom();
    typing.replaceWith(node);
    busy = false; updateComposer();
    if (stick) toBottom();
    if (!input.disabled) input.focus();
  }

  // ─── Data + status ────────────────────────────────────────────────────────
  async function loadDocuments() {
    try {
      const res = await api('/ingest/status');
      if (!res.ok) throw new Error('status');
      documents = (await res.json()).documents || [];
    } catch (err) {
      if (!(err instanceof TypeError)) toast('Couldn’t load the document list.', 'error');
    }
    selected = new Set([...selected].filter((id) => documents.some((d) => d.document_id === id)));
    renderScope();
  }

  function setOnline(value) {
    online = value;
    shell.setStatus(value);
    updateComposer();
  }

  async function newChat() {
    selected.clear();
    await loadDocuments();
    renderEmpty();
    updateComposer();
    if (!input.disabled) input.focus();
  }
  document.addEventListener('docmind:newchat', newChat);

  // ─── Boot ─────────────────────────────────────────────────────────────────
  renderScope();
  setOnline(await DocMind.checkHealth());
  await loadDocuments();
  renderEmpty();
  updateComposer();
  if (!input.disabled) input.focus();
  setInterval(async () => {
    const ok = await DocMind.checkHealth();
    if (ok !== online) { setOnline(ok); if (ok) loadDocuments(); }
  }, 30000);
})();
</script>
</body>
</html>
