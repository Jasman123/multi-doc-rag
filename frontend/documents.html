<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents — DocMind</title>
<script src="assets/theme-init.js"></script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<noscript>DocMind needs JavaScript enabled.</noscript>

<script src="assets/app.js"></script>
<script>
(async () => {
  const { el, api, json, icon, errorText, toast } = DocMind;

  const user = await DocMind.requireUser();
  if (!user) return;
  const shell = DocMind.mountShell({ active: 'documents', title: 'Documents', user });
  DocMind.checkHealth().then(shell.setStatus);

  if (user.role !== 'admin') {
    shell.main.append(el('div', { class: 'page' },
      el('div', { class: 'card' }, el('div', { class: 'empty-state' },
        el('span', { html: icon('alert') }),
        el('strong', { text: 'Administrator access required' }),
        el('span', { text: 'Ask an administrator if you need to add or manage documents.' }),
        el('a', { class: 'btn btn-secondary', href: 'index.html', text: 'Back to chat' })))));
    return;
  }

  const MAX_BYTES = 50 * 1024 * 1024;
  let documents = [];
  let loaded = false;
  let editingId = null;
  let filter = '';
  let pending = [];      // [{ file, state: 'queued'|'working'|'done'|'error', text }]
  let uploading = false;

  // ─── Upload card ──────────────────────────────────────────────────────────
  const fileInput = el('input', { type: 'file', accept: 'application/pdf,.pdf', multiple: true, id: 'fileInput', 'aria-describedby': 'dropHint' });
  const dropzone = el('label', { class: 'dropzone', for: 'fileInput' },
    el('span', { html: icon('upload') }),
    el('strong', { text: 'Drop PDFs here or click to browse' }),
    el('span', { class: 'muted', id: 'dropHint', text: 'PDF only · up to 50 MB per file' }),
    fileInput);
  const uploadList = el('ul', { class: 'upload-list', 'aria-live': 'polite' });
  const uploadBtn = el('button', { class: 'btn btn-primary', type: 'button', disabled: true });
  const clearBtn = el('button', { class: 'btn btn-secondary', type: 'button', text: 'Clear', hidden: true });
  const uploadActions = el('div', { class: 'upload-actions', hidden: true }, uploadBtn, clearBtn);

  const uploadCard = el('section', { class: 'card', 'aria-labelledby': 'uploadTitle' },
    el('h2', { id: 'uploadTitle', text: 'Add documents' }),
    el('p', { class: 'sub', text: 'Files are split into chunks and indexed so they can be searched in chat.' }),
    dropzone, uploadList, uploadActions);

  function addFiles(files) {
    for (const f of files) {
      const isPdf = f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf');
      if (!isPdf) { pending.push({ file: f, state: 'error', text: 'Not a PDF' }); continue; }
      if (f.size > MAX_BYTES) { pending.push({ file: f, state: 'error', text: 'Larger than 50 MB' }); continue; }
      pending.push({ file: f, state: 'queued', text: 'Ready' });
    }
    renderPending();
  }

  function renderPending() {
    uploadList.replaceChildren(...pending.map((p) =>
      el('li', { class: 'upload-item' },
        el('span', { html: icon('file') }),
        el('span', { class: 'name', text: p.file.name, title: p.file.name }),
        el('span', { class: `state${p.state === 'error' ? ' err' : ''}`, text: p.text }))));
    const ready = pending.filter((p) => p.state === 'queued').length;
    uploadActions.hidden = pending.length === 0;
    clearBtn.hidden = uploading || pending.length === 0;
    uploadBtn.disabled = uploading || ready === 0;
    uploadBtn.innerHTML = `${icon('upload')}<span>${uploading ? 'Indexing…' : ready ? `Upload ${ready} file${ready === 1 ? '' : 's'}` : 'Upload'}</span>`;
  }

  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
  ['dragenter', 'dragover'].forEach((t) => dropzone.addEventListener(t, (e) => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach((t) => dropzone.addEventListener(t, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));
  clearBtn.addEventListener('click', () => { pending = []; renderPending(); });

  uploadBtn.addEventListener('click', async () => {
    uploading = true; renderPending();
    let ok = 0;
    for (const p of pending.filter((x) => x.state === 'queued')) {
      p.state = 'working'; p.text = 'Indexing…'; renderPending();
      try {
        const form = new FormData();
        form.append('files', p.file);
        const res = await api('/ingest/', { method: 'POST', body: form });
        const data = await res.json().catch(() => null);
        if (!res.ok) throw new Error(errorText(data, 'Upload failed'));
        const r = data[0];
        if (r.status === 'failed') throw new Error(r.message || 'Indexing failed');
        p.state = 'done'; p.text = `Indexed · ${r.chunk_created} chunks`; ok++;
      } catch (err) {
        p.state = 'error';
        p.text = err instanceof TypeError ? 'Can’t reach the server' : err.message;
      }
      renderPending();
    }
    uploading = false; renderPending();
    if (ok) { toast(`Indexed ${ok} document${ok === 1 ? '' : 's'}.`); await loadDocuments(); }
    else toast('No documents were indexed.', 'error');
  });

  // ─── Documents table ──────────────────────────────────────────────────────
  const countEl = el('span', { class: 'muted', 'aria-live': 'polite' });
  const filterInput = el('input', { class: 'input', type: 'search', placeholder: 'Filter by name', 'aria-label': 'Filter documents by name', hidden: true });
  filterInput.addEventListener('input', () => { filter = filterInput.value.trim().toLowerCase(); renderTable(); });
  const tableHost = el('div', { class: 'table-wrap' });
  const listCard = el('section', { class: 'card', 'aria-labelledby': 'listTitle' },
    el('h2', { id: 'listTitle', text: 'Indexed documents' }),
    el('div', { class: 'table-tools' }, countEl, filterInput),
    tableHost,
    el('p', { class: 'hint', style: 'margin-top:1rem', text: 'A rename sticks if the same PDF is uploaded again. Deleting a document resets its name.' }));

  shell.main.append(el('div', { class: 'page' },
    el('div', { class: 'page-head' }, el('h1', { class: 'page-title', text: 'Documents' }), el('p', { text: 'Add, rename and remove the documents your organization can search.' })),
    uploadCard, listCard));

  function skeleton() {
    return el('div', { 'aria-busy': 'true', 'aria-label': 'Loading documents' },
      ...[0, 1, 2].map(() => el('div', { class: 'skeleton-row' },
        el('div', { class: 'skeleton', style: 'flex:1' }), el('div', { class: 'skeleton', style: 'width:64px' }), el('div', { class: 'skeleton', style: 'width:120px' }))));
  }

  function renderTable() {
    if (!loaded) { tableHost.replaceChildren(skeleton()); countEl.textContent = 'Loading…'; return; }
    countEl.textContent = `${documents.length} document${documents.length === 1 ? '' : 's'}`;
    filterInput.hidden = documents.length <= 10;
    const rows = documents.filter((d) => !filter || d.filename.toLowerCase().includes(filter));

    if (documents.length === 0) {
      tableHost.replaceChildren(el('div', { class: 'empty-state' },
        el('span', { html: icon('file') }), el('strong', { text: 'No documents indexed yet' }),
        el('span', { text: 'Upload a PDF above to get started.' })));
      return;
    }
    if (rows.length === 0) {
      tableHost.replaceChildren(el('div', { class: 'empty-state' }, el('strong', { text: 'No matches' }), el('span', { text: 'Try a different name.' })));
      return;
    }

    const body = el('tbody');
    rows.forEach((d) => body.append(buildRow(d)));
    tableHost.replaceChildren(el('table', { class: 'table' },
      el('thead', {}, el('tr', {},
        el('th', { scope: 'col', text: 'Name' }), el('th', { scope: 'col', class: 'num', text: 'Chunks' }),
        el('th', { scope: 'col', class: 'num' }, el('span', { class: 'sr-only', text: 'Actions' })))),
      body));
    const editing = tableHost.querySelector('.rename-input');
    if (editing) { editing.focus(); editing.select(); }
  }

  function buildRow(d) {
    const tr = el('tr');
    const editing = editingId === d.document_id;
    let nameCell, actions;

    if (editing) {
      const input = el('input', { class: 'input rename-input', value: d.filename, 'aria-label': `New name for ${d.filename}`, maxlength: '255' });
      const save = el('button', { class: 'btn btn-primary btn-sm', type: 'button', text: 'Save' });
      const cancel = el('button', { class: 'btn btn-secondary btn-sm', type: 'button', text: 'Cancel' });
      const doSave = () => rename(d, input.value.trim());
      save.addEventListener('click', doSave);
      cancel.addEventListener('click', () => { editingId = null; renderTable(); });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doSave();
        if (e.key === 'Escape') { editingId = null; renderTable(); }
      });
      nameCell = el('td', {}, input);
      actions = [save, cancel];
    } else {
      nameCell = el('td', {}, el('div', { class: 'doc-name' }, el('span', { html: icon('file') }),
        el('span', {}, d.filename, el('span', { class: 'doc-id', text: d.document_id }))));
      const renameBtn = el('button', { class: 'btn btn-secondary btn-sm', type: 'button', html: `${icon('pencil')}<span>Rename</span>`, 'aria-label': `Rename ${d.filename}` });
      const deleteBtn = el('button', { class: 'btn btn-danger btn-sm', type: 'button', html: `${icon('trash')}<span>Delete</span>`, 'aria-label': `Delete ${d.filename}` });
      renameBtn.addEventListener('click', () => { editingId = d.document_id; renderTable(); });
      deleteBtn.addEventListener('click', () => remove(d));
      actions = [renameBtn, deleteBtn];
    }
    tr.append(nameCell, el('td', { class: 'num', text: String(d.chunk_count) }), el('td', {}, el('div', { class: 'row-actions' }, ...actions)));
    return tr;
  }

  async function loadDocuments() {
    try {
      const res = await api('/documents/');
      if (!res.ok) throw new Error(errorText(await res.json().catch(() => null), 'Failed to load documents'));
      documents = await res.json();
    } catch (err) {
      toast(err instanceof TypeError ? 'Can’t reach the server.' : err.message, 'error');
    }
    loaded = true;
    renderTable();
  }

  async function rename(d, filename) {
    if (!filename || filename === d.filename) { editingId = null; renderTable(); return; }
    try {
      const res = await api(`/documents/${encodeURIComponent(d.document_id)}`, json('PATCH', { filename }));
      const data = await res.json().catch(() => null);
      if (!res.ok) { toast(errorText(data, 'Rename failed'), 'error'); return; }
      editingId = null;
      toast('Document renamed.');
      await loadDocuments();
    } catch (err) { toast(err.message, 'error'); }
  }

  async function remove(d) {
    const ok = await DocMind.confirmDialog({
      title: 'Delete this document?',
      message: `“${d.filename}” and all ${d.chunk_count} of its chunks will be removed and can’t be recovered. You would need to upload the PDF again.`,
      confirmLabel: 'Delete document', danger: true,
    });
    if (!ok) return;
    try {
      const res = await api(`/documents/${encodeURIComponent(d.document_id)}`, { method: 'DELETE' });
      const data = await res.json().catch(() => null);
      if (!res.ok) { toast(errorText(data, 'Delete failed'), 'error'); return; }
      toast(`Deleted (${data.chunks_deleted} chunks).`);
      await loadDocuments();
    } catch (err) { toast(err.message, 'error'); }
  }

  renderPending();
  renderTable();
  await loadDocuments();
})();
</script>
</body>
</html>
