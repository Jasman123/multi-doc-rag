<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — DocMind</title>
<script src="assets/theme-init.js"></script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<noscript>DocMind needs JavaScript enabled.</noscript>

<script src="assets/app.js"></script>
<script>
(async () => {
  const { el, api, json, icon, errorText, toast } = DocMind;

  const user = await DocMind.requireUser();
  if (!user) return;
  const shell = DocMind.mountShell({ active: 'settings', title: 'Settings', user });
  DocMind.checkHealth().then(shell.setStatus);

  if (user.role !== 'admin') {
    shell.main.append(el('div', { class: 'page' },
      el('div', { class: 'card' }, el('div', { class: 'empty-state' },
        el('span', { html: icon('alert') }),
        el('strong', { text: 'Administrator access required' }),
        el('span', { text: 'Only administrators can change these settings.' }),
        el('a', { class: 'btn btn-secondary', href: 'index.html', text: 'Back to chat' })))));
    return;
  }

  // ─── Provider form (LLM / embedder) ───────────────────────────────────────
  function field(label, control, hint) {
    const id = control.id;
    return el('div', { class: 'field' }, el('label', { for: id, text: label }), control, hint ? el('span', { class: 'hint', text: hint }) : null);
  }

  function providerCard({ role, title, description, withTemperature, labelPh, urlPh, modelPh }) {
    const uid = (n) => `${role}-${n}`;
    const provider = el('input', { class: 'input', id: uid('provider'), name: 'provider_label', placeholder: labelPh, required: true });
    const baseUrl = el('input', { class: 'input', id: uid('url'), name: 'base_url', placeholder: urlPh });
    const model = el('input', { class: 'input', id: uid('model'), name: 'model_name', placeholder: modelPh, required: true });
    const temp = withTemperature ? el('input', { class: 'input', id: uid('temp'), name: 'temperature', type: 'number', step: '0.1', min: '0', max: '2', value: '0' }) : null;

    const keyStatus = el('span', { class: 'pill', text: 'Checking…' });
    const keyToggle = el('button', { class: 'btn btn-secondary btn-sm', type: 'button', text: 'Set or replace key' });
    const keyInput = el('input', { class: 'input', id: uid('key'), name: 'api_key', type: 'password', autocomplete: 'off', placeholder: 'New API key (leave closed to keep the current key)' });
    const clearBox = el('input', { type: 'checkbox', name: 'clear_api_key' });
    const clearRow = el('label', { class: 'check' }, clearBox, el('span', { text: 'Clear the stored key (for keyless local runtimes)' }));
    const keyPanel = el('div', { hidden: true, style: 'margin-top:.75rem' }, keyInput, el('div', { style: 'margin-top:.5rem' }, clearRow));

    keyToggle.addEventListener('click', () => {
      keyPanel.hidden = !keyPanel.hidden;
      keyInput.value = ''; clearBox.checked = false;
      if (!keyPanel.hidden) keyInput.focus();
    });

    const saveBtn = el('button', { class: 'btn btn-primary', type: 'submit', text: `Save ${role === 'llm' ? 'LLM' : 'embedder'} settings` });
    const form = el('form', { class: 'card', 'aria-labelledby': uid('title') },
      el('h2', { id: uid('title'), text: title }),
      el('p', { class: 'sub', text: description }),
      el('div', { class: 'form-grid' },
        field('Provider label', provider),
        field('Model name', model),
        el('div', { class: 'full' }, field('Base URL', baseUrl, 'Leave empty for OpenAI.')),
        temp ? field('Temperature', temp, '0 = most deterministic, up to 2.') : null),
      el('div', { class: 'field' },
        el('span', { class: 'field-label', text: 'API key' }),
        el('div', { class: 'key-row' }, keyStatus, keyToggle),
        keyPanel),
      saveBtn);

    async function load() {
      try {
        const res = await api(`/admin/config/${role}`);
        if (!res.ok) throw new Error(`Couldn’t load ${role} settings`);
        const data = await res.json();
        if (!data) { keyStatus.textContent = 'Not configured yet'; keyStatus.classList.remove('on'); return; }
        provider.value = data.provider_label;
        baseUrl.value = data.base_url || '';
        model.value = data.model_name;
        if (temp) temp.value = data.temperature ?? 0;
        keyStatus.textContent = data.api_key_set ? 'Key configured' : 'No key set';
        keyStatus.classList.toggle('on', data.api_key_set);
      } catch (err) {
        keyStatus.textContent = 'Unavailable';
        toast(err instanceof TypeError ? 'Can’t reach the server.' : err.message, 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = { provider_label: provider.value.trim(), base_url: baseUrl.value.trim() || null, model_name: model.value.trim() };
      if (temp) body.temperature = parseFloat(temp.value);
      if (!keyPanel.hidden) {
        if (clearBox.checked) body.clear_api_key = true;
        else if (keyInput.value) body.api_key = keyInput.value;
      }
      saveBtn.disabled = true;
      try {
        const res = await api(`/admin/config/${role}`, json('PUT', body));
        const data = await res.json().catch(() => null);
        if (!res.ok) { toast(errorText(data, 'Save failed'), 'error'); return; }
        toast(`${role === 'llm' ? 'LLM' : 'Embedder'} settings saved.`);
        keyPanel.hidden = true; keyInput.value = ''; clearBox.checked = false;
        await load();
      } catch (err) {
        toast(err instanceof TypeError ? 'Can’t reach the server.' : err.message, 'error');
      } finally { saveBtn.disabled = false; }
    });

    return { form, load };
  }

  const llm = providerCard({
    role: 'llm', title: 'Language model', description: 'Used to write answers in the retrieval pipeline.', withTemperature: true,
    labelPh: 'openai / gemini / ollama', urlPh: 'e.g. http://localhost:11434/v1', modelPh: 'e.g. gpt-4o-mini',
  });
  const embedder = providerCard({
    role: 'embedder', title: 'Embedding model', description: 'Used to embed document chunks at upload time and questions at query time.', withTemperature: false,
    labelPh: 'openai / gemini / ollama', urlPh: 'Leave empty for OpenAI', modelPh: 'e.g. text-embedding-3-small',
  });

  // ─── Answer sources toggle ────────────────────────────────────────────────
  let showSources = false;
  const sourcesSwitch = el('button', { class: 'switch', type: 'button', role: 'switch', 'aria-checked': 'false', 'aria-labelledby': 'sourcesLabel', disabled: true });
  const sourcesState = el('span', { class: 'pill', text: 'Loading…' });
  function renderSources() {
    sourcesSwitch.setAttribute('aria-checked', String(showSources));
    sourcesSwitch.disabled = false;
    sourcesState.textContent = showSources ? 'Sources shown' : 'Sources hidden';
    sourcesState.classList.toggle('on', showSources);
  }
  sourcesSwitch.addEventListener('click', async () => {
    sourcesSwitch.disabled = true;
    try {
      const res = await api('/admin/settings', json('PUT', { show_sources: !showSources }));
      if (!res.ok) throw new Error('Couldn’t update the setting');
      showSources = (await res.json()).show_sources;
      toast(showSources ? 'Sources are now shown to all users.' : 'Sources are now hidden from all users.');
    } catch (err) {
      toast(err instanceof TypeError ? 'Can’t reach the server.' : err.message, 'error');
    }
    renderSources();
  });
  const sourcesCard = el('section', { class: 'card', 'aria-labelledby': 'sourcesLabel' },
    el('div', { class: 'setting-row' },
      el('div', {},
        el('h2', { id: 'sourcesLabel', text: 'Answer sources' }),
        el('p', { class: 'sub', style: 'margin-bottom:0', text: 'Show the retrieved passages under each answer. Hidden by default; applies to all users.' })),
      el('div', { class: 'key-row' }, sourcesState, sourcesSwitch)));

  shell.main.append(el('div', { class: 'page' },
    el('div', { class: 'page-head' }, el('h1', { class: 'page-title', text: 'Settings' }), el('p', { text: 'Model providers and answer display. Changes apply to everyone.' })),
    llm.form, embedder.form, sourcesCard));

  await Promise.all([llm.load(), embedder.load()]);
  try {
    const res = await api('/admin/settings');
    if (!res.ok) throw new Error('Couldn’t load settings');
    showSources = (await res.json()).show_sources;
    renderSources();
  } catch (err) {
    sourcesState.textContent = 'Unavailable';
    toast(err instanceof TypeError ? 'Can’t reach the server.' : err.message, 'error');
  }
})();
</script>
</body>
</html>
